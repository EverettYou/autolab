[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Placeholder until a consumer enables features.lib and adds src/<package>/.
# Do not put a package under lib/src/ in the this template.
[project]
name = "lab-lib"
version = "0.0.0"
description = "Optional shared package for this lab (empty until enabled)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
