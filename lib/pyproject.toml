[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toyattn"
version = "0.1.0"
description = "Template demo package: tiny attention helpers (Autolab only; stripped on create_project)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/toyattn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
